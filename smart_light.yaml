blueprint:
  name: Smart Light – PIR + Ambient + Rozvrh
  description: >
    Chytré ovládání světla: zapíná se pohybem (pokud je tma) NEBO
    podle rozvrhu (pevný čas / západ / východ slunce s offsetem).
    Zhasíná po timeoutu bez pohybu, ale ne pokud jsme v časovém okně.
    Jeden blueprint = jedno světlo. Více světel = více instancí.
  domain: automation
  source_url: https://github.com/Gargy007/ha_blueprints/blob/main/smart_light.yaml
  author: Gargy007
  input:
    # ── Světlo ──
    light_target:
      name: Světlo
      description: Světlo nebo skupina světel k ovládání.
      selector:
        target:
          entity:
            domain: light

    # ── PIR / Pohyb ──
    motion_sensors:
      name: Senzory pohybu
      description: Jeden nebo více PIR / occupancy senzorů.
      selector:
        entity:
          multiple: true
          filter:
            - device_class: occupancy
              domain: binary_sensor
            - device_class: motion
              domain: binary_sensor

    # ── Ambient ──
    ambient_sensor:
      name: Senzor okolního osvětlení
      description: Světlo se zapne pohybem jen pokud je osvětlení pod prahem.
      selector:
        entity:
          filter:
            - device_class: illuminance
              domain: sensor

    ambient_threshold:
      name: Práh osvětlení (lux)
      description: Maximální osvětlení pro aktivaci pohybem.
      default: 50
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lux

    # ── Timeout ──
    motion_timeout:
      name: Timeout po pohybu (sekundy)
      description: Jak dlouho nechat svítit po poslední detekci pohybu.
      default: 120
      selector:
        number:
          min: 5
          max: 3600
          unit_of_measurement: seconds

    # ── Rolety (volitelné) ──
    cover_entities:
      name: Rolety / závěsy (volitelné)
      description: >
        Pokud jsou vybrány a VŠECHNY jsou zavřené (closed),
        PIR pohyb nebude aktivovat světlo.
        Nechte prázdné pokud nepotřebujete.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: cover

    # ── Rozvrh ZAPNUTÍ ──
    schedule_on_type:
      name: "Rozvrh ZAP: typ"
      description: >
        Kdy automaticky zapnout světlo.
        "disabled" = bez rozvrhu, jen pohyb.
      default: disabled
      selector:
        select:
          options:
            - label: Vypnuto (jen pohyb)
              value: disabled
            - label: Pevný čas
              value: fixed_time
            - label: Západ slunce
              value: sunset
            - label: Východ slunce
              value: sunrise

    schedule_on_time:
      name: "Rozvrh ZAP: čas (pro pevný čas)"
      description: Ignoruje se pokud typ není "Pevný čas".
      default: "18:00:00"
      selector:
        time:

    schedule_on_offset:
      name: "Rozvrh ZAP: offset (minuty)"
      description: >
        Offset v minutách pro sunset/sunrise.
        Záporné = před událostí, kladné = po. Ignoruje se pro pevný čas.
      default: 0
      selector:
        number:
          min: -120
          max: 120
          unit_of_measurement: min

    # ── Rozvrh VYPNUTÍ ──
    schedule_off_type:
      name: "Rozvrh VYP: typ"
      description: >
        Kdy automaticky vypnout rozvrhem zapnuté světlo.
        "disabled" = nevypínat rozvrhem (jen timeout po pohybu).
      default: disabled
      selector:
        select:
          options:
            - label: Vypnuto (jen timeout)
              value: disabled
            - label: Pevný čas
              value: fixed_time
            - label: Západ slunce
              value: sunset
            - label: Východ slunce
              value: sunrise

    schedule_off_time:
      name: "Rozvrh VYP: čas (pro pevný čas)"
      description: Ignoruje se pokud typ není "Pevný čas".
      default: "23:00:00"
      selector:
        time:

    schedule_off_offset:
      name: "Rozvrh VYP: offset (minuty)"
      description: >
        Offset v minutách pro sunset/sunrise.
        Záporné = před událostí, kladné = po. Ignoruje se pro pevný čas.
      default: 0
      selector:
        number:
          min: -120
          max: 120
          unit_of_measurement: min

mode: restart
max_exceeded: silent

variables:
  motion_sensors: !input motion_sensors
  cover_ents: !input cover_entities
  sched_on_type: !input schedule_on_type
  sched_off_type: !input schedule_off_type
  sched_on_time: !input schedule_on_time
  sched_off_time: !input schedule_off_time
  sched_on_offset: !input schedule_on_offset
  sched_off_offset: !input schedule_off_offset
  # Vypočítej efektivní časy ZAP/VYP
  effective_on_time: >
    {% if sched_on_type == 'fixed_time' %}
      {{ sched_on_time }}
    {% elif sched_on_type == 'sunset' %}
      {{ (state_attr('sun.sun', 'next_setting') | as_datetime + timedelta(minutes=sched_on_offset | int(0))) .strftime('%H:%M:%S') }}
    {% elif sched_on_type == 'sunrise' %}
      {{ (state_attr('sun.sun', 'next_rising') | as_datetime + timedelta(minutes=sched_on_offset | int(0))) .strftime('%H:%M:%S') }}
    {% else %}
      none
    {% endif %}
  effective_off_time: >
    {% if sched_off_type == 'fixed_time' %}
      {{ sched_off_time }}
    {% elif sched_off_type == 'sunset' %}
      {{ (state_attr('sun.sun', 'next_setting') | as_datetime + timedelta(minutes=sched_off_offset | int(0))) .strftime('%H:%M:%S') }}
    {% elif sched_off_type == 'sunrise' %}
      {{ (state_attr('sun.sun', 'next_rising') | as_datetime + timedelta(minutes=sched_off_offset | int(0))) .strftime('%H:%M:%S') }}
    {% else %}
      none
    {% endif %}
  # Jsme právě v časovém okně?
  in_schedule_window: >
    {% if sched_on_type == 'disabled' or sched_off_type == 'disabled' %}
      false
    {% else %}
      {% set now_t = now().strftime('%H:%M:%S') %}
      {% set on_t = effective_on_time %}
      {% set off_t = effective_off_time %}
      {% if on_t < off_t %}
        {{ on_t <= now_t < off_t }}
      {% else %}
        {{ now_t >= on_t or now_t < off_t }}
      {% endif %}
    {% endif %}

triggers:
  # ── Pohyb ZAP ──
  - trigger: state
    entity_id: !input motion_sensors
    to: "on"
    id: motion_on

  # ── Pohyb VYP ──
  - trigger: state
    entity_id: !input motion_sensors
    to: "off"
    id: motion_off

  # ── Rozvrh ZAP: západ slunce ──
  - trigger: template
    value_template: >
      {{ sched_on_type == 'sunset' and
         now().strftime('%H:%M') == (state_attr('sun.sun', 'next_setting') | as_datetime + timedelta(minutes=sched_on_offset | int(0))).strftime('%H:%M') }}
    id: schedule_on

  # ── Rozvrh ZAP: východ slunce ──
  - trigger: template
    value_template: >
      {{ sched_on_type == 'sunrise' and
         now().strftime('%H:%M') == (state_attr('sun.sun', 'next_rising') | as_datetime + timedelta(minutes=sched_on_offset | int(0))).strftime('%H:%M') }}
    id: schedule_on

  # ── Rozvrh ZAP: pevný čas ──
  - trigger: time
    at: !input schedule_on_time
    id: schedule_on_fixed

  # ── Rozvrh VYP: západ slunce ──
  - trigger: template
    value_template: >
      {{ sched_off_type == 'sunset' and
         now().strftime('%H:%M') == (state_attr('sun.sun', 'next_setting') | as_datetime + timedelta(minutes=sched_off_offset | int(0))).strftime('%H:%M') }}
    id: schedule_off

  # ── Rozvrh VYP: východ slunce ──
  - trigger: template
    value_template: >
      {{ sched_off_type == 'sunrise' and
         now().strftime('%H:%M') == (state_attr('sun.sun', 'next_rising') | as_datetime + timedelta(minutes=sched_off_offset | int(0))).strftime('%H:%M') }}
    id: schedule_off

  # ── Rozvrh VYP: pevný čas ──
  - trigger: time
    at: !input schedule_off_time
    id: schedule_off_fixed

conditions: []

actions:
  - choose:
      # ════════════════════════════════════════
      # POHYB DETEKOVÁN
      # ════════════════════════════════════════
      - conditions:
          - condition: trigger
            id: motion_on
        sequence:
          - condition: numeric_state
            entity_id: !input ambient_sensor
            below: !input ambient_threshold
          # Blokuj PIR pokud jsou všechny rolety zavřené
          - condition: template
            value_template: >
              {{ cover_ents | length == 0 or
                 expand(cover_ents)
                 | selectattr('state', 'eq', 'closed')
                 | list | count < cover_ents | length }}
          - action: light.turn_on
            target: !input light_target

      # ════════════════════════════════════════
      # POHYB SKONČIL → timeout → zhasni (pokud nejsme v okně)
      # ════════════════════════════════════════
      - conditions:
          - condition: trigger
            id: motion_off
        sequence:
          - delay:
              seconds: !input motion_timeout
          # Ověř, že žádný senzor už nedetekuje
          - condition: template
            value_template: >
              {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
          # Nezhasínej pokud jsme v rozvrhovém okně
          - condition: template
            value_template: "{{ not in_schedule_window }}"
          - action: light.turn_off
            target: !input light_target

      # ════════════════════════════════════════
      # ROZVRH ZAP (sunset/sunrise)
      # ════════════════════════════════════════
      - conditions:
          - condition: trigger
            id: schedule_on
        sequence:
          - action: light.turn_on
            target: !input light_target

      # ════════════════════════════════════════
      # ROZVRH ZAP (pevný čas) — jen pokud typ = fixed_time
      # ════════════════════════════════════════
      - conditions:
          - condition: trigger
            id: schedule_on_fixed
          - condition: template
            value_template: "{{ sched_on_type == 'fixed_time' }}"
        sequence:
          - action: light.turn_on
            target: !input light_target

      # ════════════════════════════════════════
      # ROZVRH VYP (sunset/sunrise) — zhasni pokud není pohyb
      # ════════════════════════════════════════
      - conditions:
          - condition: trigger
            id: schedule_off
        sequence:
          - condition: template
            value_template: >
              {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
          - action: light.turn_off
            target: !input light_target

      # ════════════════════════════════════════
      # ROZVRH VYP (pevný čas) — jen pokud typ = fixed_time
      # ════════════════════════════════════════
      - conditions:
          - condition: trigger
            id: schedule_off_fixed
          - condition: template
            value_template: "{{ sched_off_type == 'fixed_time' }}"
        sequence:
          - condition: template
            value_template: >
              {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
          - action: light.turn_off
            target: !input light_target
