blueprint:
  name: Smart Light – PIR + Ambient + Rozvrh
  description: >
    Chytré ovládání světla: zapíná se pohybem (pokud je tma) NEBO
    podle rozvrhu (západ / východ slunce s offsetem a délkou svícení).
    Zhasíná po timeoutu bez pohybu, ale ne pokud jsme v časovém okně.
    Jeden blueprint = jedno světlo. Více světel = více instancí.
  domain: automation
  source_url: https://github.com/Gargy007/ha_blueprints/blob/main/smart_light.yaml
  author: Gargy007
  input:
    # ── Světlo ──
    light_target:
      name: Světlo
      description: Světlo nebo skupina světel k ovládání.
      selector:
        target:
          entity:
            domain: light

    # ── PIR / Pohyb ──
    motion_sensors:
      name: Senzory pohybu
      description: Jeden nebo více PIR / occupancy senzorů.
      selector:
        entity:
          multiple: true
          filter:
            - device_class: occupancy
              domain: binary_sensor
            - device_class: motion
              domain: binary_sensor

    # ── Ambient ──
    ambient_sensor:
      name: Senzor okolního osvětlení
      description: Světlo se zapne pohybem jen pokud je osvětlení pod prahem.
      selector:
        entity:
          filter:
            - device_class: illuminance
              domain: sensor

    ambient_threshold:
      name: Práh osvětlení (lux)
      description: Maximální osvětlení pro aktivaci pohybem.
      default: 50
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lux

    # ── Timeout ──
    motion_timeout:
      name: Timeout po pohybu (sekundy)
      description: Jak dlouho nechat svítit po poslední detekci pohybu.
      default: 120
      selector:
        number:
          min: 5
          max: 3600
          unit_of_measurement: seconds

    # ── Rolety (volitelné) ──
    cover_entities:
      name: Rolety / závěsy (volitelné)
      description: >
        Pokud jsou vybrány a VŠECHNY jsou zavřené (closed),
        PIR pohyb nebude aktivovat světlo.
        Nechte prázdné pokud nepotřebujete.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: cover

    # ── Zpoždění ZigBee ──
    light_stagger_delay:
      name: "Zpoždění mezi světly (ms)"
      description: >
        Zpoždění mezi zapnutím jednotlivých světel.
        Pomáhá při výpadcích ZigBee sítě. 0 = bez zpoždění.
      default: 500
      selector:
        number:
          min: 0
          max: 5000
          unit_of_measurement: ms
          step: 100
          mode: slider

    # ── Rozvrh ──
    schedule_on_type:
      name: "Rozvrh: start"
      description: >
        Kdy automaticky zapnout světlo.
        "disabled" = bez rozvrhu, jen pohyb. Světlo pak svítí po nastavenou dobu.
      default: disabled
      selector:
        select:
          options:
            - label: Vypnuto (jen pohyb)
              value: disabled
            - label: Západ slunce
              value: sunset
            - label: Východ slunce
              value: sunrise

    schedule_on_offset:
      name: "Rozvrh: offset startu (minuty)"
      description: >
        Offset v minutách pro sunset/sunrise.
        Záporné = před událostí, kladné = po.
      default: 0
      selector:
        number:
          min: -120
          max: 120
          unit_of_measurement: min

    schedule_duration:
      name: "Rozvrh: délka svícení (minuty)"
      description: Jak dlouho má světlo svítit po automatickém zapnutí rozvrhem.
      default: 60
      selector:
        number:
          min: 1
          max: 360
          unit_of_measurement: min

mode: restart
max_exceeded: silent

variables:
  motion_sensors: !input motion_sensors
  cover_ents: !input cover_entities
  sched_on_type: !input schedule_on_type
  sched_on_offset: !input schedule_on_offset
  schedule_duration_minutes: !input schedule_duration
  # Vypočítej efektivní čas ZAP
  # Pozn: po západu slunce se next_setting překlápí na zítřek → pro kladný
  # offset musíme odečíst 1 den, aby výpočet odpovídal dnešnímu západu.
  effective_on_time: >
    {% if sched_on_type == 'sunset' %}
      {% set ns = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
      {% set base = ns - timedelta(days=1) if ns.date() > now().date() else ns %}
      {{ (base + timedelta(minutes=sched_on_offset | int(0))).strftime('%H:%M:%S') }}
    {% elif sched_on_type == 'sunrise' %}
      {% set nr = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
      {% set base = nr - timedelta(days=1) if nr.date() > now().date() else nr %}
      {{ (base + timedelta(minutes=sched_on_offset | int(0))).strftime('%H:%M:%S') }}
    {% else %}
      none
    {% endif %}
  # Jsme právě v časovém okně?
  in_schedule_window: >
    {% if sched_on_type == 'disabled' %}
      false
    {% else %}
      {% set start_today = today_at(effective_on_time) %}
      {% set start = start_today if now() >= start_today else start_today - timedelta(days=1) %}
      {{ start <= now() < start + timedelta(minutes=schedule_duration_minutes | int(0)) }}
    {% endif %}
  # Extrakce entity ID světel pro staggered zapínání
  _lt_raw: !input light_target
  light_entity_list: >
    {% set ids = _lt_raw.get('entity_id', []) %}
    {% if ids is string %}{{ [ids] }}{% else %}{{ ids | list }}{% endif %}
  light_stagger_ms: !input light_stagger_delay

triggers:
  # ── Pohyb ZAP ──
  - trigger: state
    entity_id: !input motion_sensors
    to: "on"
    id: motion_on

  # ── Pohyb VYP ──
  - trigger: state
    entity_id: !input motion_sensors
    to: "off"
    id: motion_off

  # ── Rozvrh ZAP: západ slunce ──
  # Po západu se next_setting překlopí na zítřek → odečteme 1 den
  - trigger: template
    value_template: >
      {% if sched_on_type != 'sunset' %}
        false
      {% else %}
        {% set ns = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
        {% set base = ns - timedelta(days=1) if ns.date() > now().date() else ns %}
        {{ now().strftime('%H:%M') == (base + timedelta(minutes=sched_on_offset | int(0))).strftime('%H:%M') }}
      {% endif %}
    id: schedule_on

  # ── Rozvrh ZAP: východ slunce ──
  - trigger: template
    value_template: >
      {% if sched_on_type != 'sunrise' %}
        false
      {% else %}
        {% set nr = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
        {% set base = nr - timedelta(days=1) if nr.date() > now().date() else nr %}
        {{ now().strftime('%H:%M') == (base + timedelta(minutes=sched_on_offset | int(0))).strftime('%H:%M') }}
      {% endif %}
    id: schedule_on

  # ── Rozvrh VYP: start + délka svícení ──
  - trigger: template
    value_template: >
      {% if sched_on_type == 'disabled' %}
        false
      {% else %}
        {% set start_today = today_at(effective_on_time) %}
        {% set start = start_today if now() >= start_today else start_today - timedelta(days=1) %}
        {{ now().strftime('%H:%M') == (start + timedelta(minutes=schedule_duration_minutes | int(0))).strftime('%H:%M') }}
      {% endif %}
    id: schedule_off

conditions: []

actions:
  - choose:
      # ════════════════════════════════════════
      # POHYB DETEKOVÁN
      # ════════════════════════════════════════
      - conditions:
          - condition: trigger
            id: motion_on
        sequence:
          - condition: numeric_state
            entity_id: !input ambient_sensor
            below: !input ambient_threshold
          # Blokuj PIR pokud jsou všechny rolety zavřené
          - condition: template
            value_template: >
              {% set expanded = expand(cover_ents) | list %}
              {{ cover_ents | length == 0 or
                 expanded | selectattr('state', 'eq', 'closed')
                 | list | count < expanded | count }}
          - repeat:
              for_each: "{{ light_entity_list }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                - delay:
                    milliseconds: "{{ light_stagger_ms | int }}"

      # ════════════════════════════════════════
      # POHYB SKONČIL → timeout → zhasni (pokud nejsme v okně)
      # ════════════════════════════════════════
      - conditions:
          - condition: trigger
            id: motion_off
        sequence:
          - delay:
              seconds: !input motion_timeout
          # Ověř, že žádný senzor už nedetekuje
          - condition: template
            value_template: >
              {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
          # Nezhasínej pokud jsme v rozvrhovém okně
          - condition: template
            value_template: "{{ not in_schedule_window }}"
          - action: light.turn_off
            target: !input light_target

      # ════════════════════════════════════════
      # ROZVRH ZAP (sunset/sunrise)
      # ════════════════════════════════════════
      - conditions:
          - condition: trigger
            id: schedule_on
        sequence:
          - repeat:
              for_each: "{{ light_entity_list }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                - delay:
                    milliseconds: "{{ light_stagger_ms | int }}"

      # ════════════════════════════════════════
      # ROZVRH VYP (po délce svícení)
      # ════════════════════════════════════════
      - conditions:
          - condition: trigger
            id: schedule_off
        sequence:
          - wait_template: >
              {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
            timeout:
              seconds: !input motion_timeout
            continue_on_timeout: true
          - action: light.turn_off
            target: !input light_target

